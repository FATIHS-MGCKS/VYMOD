name: Governance

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.22.0/gitleaks_8.22.0_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Governance validators
        env:
          CI: "true"
        run: npm run validate
      - name: Validator unit tests
        run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint mobile
        run: npm run lint
      - name: Mobile unit tests
        run: npm run test:mobile
      - name: Expo doctor
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Export iOS bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir /tmp/vymod-export-ios
      - name: Export Android bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/vymod-export-android
